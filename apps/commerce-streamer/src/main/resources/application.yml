server:
  shutdown: graceful
  tomcat:
    threads:
      max: 200 # 최대 워커 스레드 수 (default : 200)
      min-spare: 10 # 최소 유지 스레드 수 (default : 10)
    connection-timeout: 1m # 연결 타임아웃 (ms) (default : 60000ms = 1m)
    max-connections: 8192 # 최대 동시 연결 수 (default : 8192)
    accept-count: 100 # 대기 큐 크기 (default : 100)
    keep-alive-timeout: 60s # 60s
  max-http-request-header-size: 8KB

spring:
  main:
    web-application-type: servlet
  application:
    name: commerce-streamer
  profiles:
    active: local
  config:
    import:
      - jpa.yml
      - kafka.yml
      - logging.yml
      - monitoring.yml

demo-kafka:
  test:
    topic-name: demo.internal.topic-v1

---
# The order events listener's promises (ADR 0033 rules 6 and 7). They sit in a document of their own, below the one that
# imports kafka.yml: an imported file overrides the document that imports it, and kafka.yml sets the template's group-id.
# A new group starts from the earliest retained record, so a streamer deployed after commerce-api skips no confirmation;
# recording the same fact again writes nothing, so reading again is safe. The topic belongs to commerce-api, so a missing
# topic must not be auto-created as a one-partition topic.
spring:
  kafka:
    consumer:
      group-id: commerce-streamer
      properties:
        auto.offset.reset: earliest
        allow.auto.create.topics: false

---
spring:
  config:
    activate:
      on-profile: local, test

---
spring:
  config:
    activate:
      on-profile: test

# The template's demo listener stays registered, but its container does not start, so no test consumes its topic.
demo-kafka:
  auto-startup: false

---
spring:
  config:
    activate:
      on-profile: dev

---
spring:
  config:
    activate:
      on-profile: qa

---
spring:
  config:
    activate:
      on-profile: prd

springdoc:
  api-docs:
    enabled: false
