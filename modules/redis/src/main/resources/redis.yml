spring:
  data:
    redis:
      repositories:
        enabled: false

datasource:
  redis:
    database: 0
    # Redis가 멈추거나 걸려도 명령은 100 ms, 연결은 1 s 안에 포기한다. Lettuce 기본값은 60 s와 10 s다.
    command-timeout: 100ms
    connect-timeout: 1s
    master:
      host: ${REDIS_MASTER_HOST}
      port: ${REDIS_MASTER_PORT}
    replicas:
      - host: ${REDIS_REPLICA_1_HOST}
        port: ${REDIS_REPLICA_1_PORT}

---
spring.config.activate.on-profile: local, test

datasource:
  redis:
    master:
      host: localhost
      port: 6379
    replicas:
      - host: localhost
        port: 6380

---
spring.config.activate.on-profile: dev

---
spring.config.activate.on-profile: qa

---
spring.config.activate.on-profile: prd